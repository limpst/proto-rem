services:
  - type: web
    name: proto-rem
    runtime: python
    plan: free
    # 표준 라이브러리만 쓴다. requirements.txt 는 비어 있어도 Render 가 파이썬으로 인식하게 둔다.
    buildCommand: pip install -r requirements.txt
    startCommand: python -m py.server
    healthCheckPath: /api/state

    # --- 데이터 영구 저장 -------------------------------------------------
    # 무료 플랜은 재배포마다 파일 시스템이 초기화된다. 그래서 SQLite 파일
    # (data/proto-rem.db)이 통째로 사라지고 화면이 샘플 시드로 되돌아간다.
    #
    # 영구히 두려면 유료 플랜(Starter 이상)으로 올린 뒤 아래 3줄의 주석을 풀면 된다.
    # 코드는 이미 /var/data 가 마운트돼 있으면 자동으로 그쪽에 저장한다(py/paths.py).
    # 별도 환경변수도, 코드 수정도 필요 없다.
    #
    # disk:
    #   name: proto-rem-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # 플랜을 올리지 않고 다른 위치에 두려면 DATA_DIR 환경변수로 지정한다.
    # 화면 좌측 하단 [저장] 칸이 지금 상태(영구 / 휘발성)를 그대로 보여준다.
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # 서버에는 Ollama 도 Claude CLI 도 없다. 반드시 claude-api 로 둔다.
      # (claude-cli 로 두면 "spawn claude ENOENT" 가 난다 — 서버에 CLI 가 없어서다.)
      - key: LLM_BACKEND
        value: claude-api
      # 아래 값들은 Render 대시보드에서 직접 입력한다 (저장소에 두지 않는다).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        sync: false
      # 실전 발송 전까지는 1로 둔다.
      - key: DRY_RUN
        value: "1"

      # --- 접속 잠금 -----------------------------------------------------
      # 이 화면에는 명함(개인정보)과 발송 설정, 저장된 API 키가 들어 있다.
      # APP_PASSWORD 가 비어 있으면 서버가 아예 열리지 않고 안내 화면만 뜬다
      # (py/server.py 의 _auth_needed). 잠그는 것을 잊으면 공개되던 것을 막는다.
      #
      # 비밀번호는 여기 적지 않는다. 이 저장소는 공개돼 있어 적는 순간
      # 누구나 읽을 수 있고, 잠금이 있으나 마나가 된다.
      # sync: false 는 "값은 Render 대시보드에서 직접 넣는다" 는 뜻이다.
      - key: APP_USER
        value: atom
      - key: APP_PASSWORD
        sync: false
      # 로그인 화면 아래에 그대로 보여 줄 문구. 여기에 비밀번호를 적으면
      # 화면을 여는 누구나 볼 수 있어 잠금이 무의미해진다.
      - key: APP_HINT
        sync: false
