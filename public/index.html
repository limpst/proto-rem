<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proto-rem · 에이톰엔지니어링 아웃바운드 콘솔</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --tx:#e6e9ef; --tx2:#9aa4b6; --tx3:#6b7385;
    --accent:#4f8cff; --ok:#3ecf8e; --warn:#f5a623; --bad:#ff5d5d;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
    font:14px/1.6 "Pretendard","Malgun Gothic",system-ui,sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
    align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;letter-spacing:-.2px}
  header .sub{color:var(--tx2);font-size:12px}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 24px 80px}

  /* 7단계 레일 */
  .rail{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:8px 0 22px}
  .st{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    cursor:pointer;transition:.15s;position:relative}
  .st:hover{border-color:#3a4252}
  .st.active{border-color:var(--accent);background:#182136}
  .st.done{border-color:#2c4a3c}
  .st .n{font-size:11px;color:var(--tx2)}
  .st .l{font-size:13px;font-weight:600;margin-top:2px}
  .st .hitl{position:absolute;top:8px;right:9px;font-size:9px;background:#3a2d12;color:var(--warn);
    border:1px solid #5a4415;padding:1px 5px;border-radius:99px;letter-spacing:.3px}
  .st.done::after{content:"✓";position:absolute;bottom:8px;right:10px;color:var(--ok);font-size:12px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .panel h2{margin:0 0 4px;font-size:15px}
  .panel .desc{color:var(--tx2);font-size:12.5px;margin-bottom:14px}

  button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  button:hover{filter:brightness(1.1)}
  button:disabled{opacity:.4;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx2)}
  button.ok{background:var(--ok);color:#06281c}
  button.bad{background:transparent;border:1px solid #5a2c2c;color:var(--bad)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--tx2);font-weight:500;font-size:11.5px;padding:8px 10px;
    border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
  td{padding:9px 10px;border-bottom:1px solid #21252e;vertical-align:top}
  tr:hover td{background:#1b1f28}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;
    background:var(--panel2);border:1px solid var(--line);color:var(--tx2)}
  .tag.seg{background:#16233a;border-color:#26406b;color:#9dc0ff}
  .muted{color:var(--tx2)}
  .facts{font-size:11.5px;color:var(--tx2);margin-top:4px}
  .facts li{margin-left:-8px}

  .msg{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .msg .to{font-size:12px;color:var(--tx2);margin-bottom:8px}
  .msg input,.msg textarea{width:100%;background:#12151b;border:1px solid var(--line);color:var(--tx);
    border-radius:6px;padding:9px 11px;font:inherit;font-size:13px;margin-bottom:8px}
  .msg textarea{min-height:150px;resize:vertical;line-height:1.75}
  .checks{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}
  .chk{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid}
  .chk.p{color:var(--ok);border-color:#2c4a3c;background:#122019}
  .chk.f{color:var(--bad);border-color:#5a2c2c;background:#231416}
  .banner{background:#231a10;border:1px solid #5a4415;color:#f0c073;padding:10px 14px;
    border-radius:8px;font-size:12.5px;margin-bottom:14px}
  .spin{color:var(--accent);font-size:12.5px}
</style>
</head>
<body>
<header>
  <h1>proto-rem</h1>
  <span class="sub">㈜에이톰엔지니어링 · 명함 기반 아웃바운드 콘솔 <span id="src"></span></span>
</header>
<div class="wrap">
  <div class="rail" id="rail"></div>
  <div id="view"></div>
</div>
<script src="/app.js"></script>
</body>
</html>
